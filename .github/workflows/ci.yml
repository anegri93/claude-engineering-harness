name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # The shell expands the glob so the command works on every supported Node version.
      - run: node --test tests/*.test.mjs

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned rather than using the runner's preinstalled shellcheck: the two versions
      # disagree on which code an unreachable command gets, so an unpinned job fails on
      # findings that are clean locally.
      - run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            install.sh uninstall.sh src/hooks/*.sh tools/*.sh project-template/.claude/*.sh
